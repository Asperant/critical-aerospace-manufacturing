[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectctl"
version = "0.1.0"
description = "CTRL-PM-001 offline canonical WBS parser and validator"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "rich>=13,<15", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10"]

[project.scripts]
projectctl = "projectctl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
