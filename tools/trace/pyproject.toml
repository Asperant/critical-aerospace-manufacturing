# WP-GOV-002 — trace registry, edges and trace linter (01 Item 83, 03 §18).
# The registry lives in traceability/; this package loads, seeds and lints it.
# Slice 1: schema, loader, seed from the 03 §17 records, TL-01/TL-04/TL-05.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-trace"
version = "0.1.0"
description = "Machine-readable trace registry and trace linter (WP-GOV-002)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
