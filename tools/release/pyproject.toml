# WP-CICD-002 — release pipeline tooling: ReleaseManifest, DeploymentRecord, deploy.
# The image registry is release/images.json; this package validates it, builds and
# validates manifests and records, and runs the digest-pinned deployment.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-release"
version = "0.1.0"
description = "Release manifest, deployment record and digest-pinned deploy (WP-CICD-002)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cap_release = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
