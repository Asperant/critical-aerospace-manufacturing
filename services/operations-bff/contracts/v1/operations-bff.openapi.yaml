openapi: 3.1.0
info:
  title: Command Center BFF (operations-bff) v1
  version: 1.0.0
  summary: Browser-facing contract; the only normal path from browser to backend.
  description: |
    WP-UI-001 (DN-UI-BFFCON). Contract surface only: no runtime and no routes
    of the web application are defined.
    The BFF composes backend facts for display and owns no domain authority
    (BFF-INV-1..7). The browser reaches only this API: never the event broker,
    a database or a private service API. Actor identity comes from the
    authenticated session on the server side and is never a request field.
x-bff-contract:
  contract_id: bff.operations-bff.v1
  semantic_owner: Asrin Dundar
x-bff-actor-context:
  source: SESSION
  browser_supplied_fields: []
  composed_from:
    - actor_id and roles from the server-validated session
    - environment_id from the session
    - world_id from the request world binding, forwarded unchanged
  propagated_to:
    - manufacturing-core
    - automation-service
  semantics: >-
    The BFF builds the ActorContext actor from the authenticated session only.
    Nothing in a request body, query or header is trusted as actor identity,
    role or permission. Roles are identity-provider claims, an input to the
    backend policy engine and never a decision. Backends re-authorize every
    command at acceptance time; the BFF forwards the actor and does not
    substitute, elevate or launder it.
x-bff-streaming:
  boundary: >-
    Streaming is not an OpenAPI path. After the initial Query snapshot the
    BFF pushes StreamMessage values over a browser-facing channel whose
    transport (WebSocket or SSE) is an open architecture decision.
    The browser never connects to the event backbone.
  transport: UNDECIDED
  snapshot_operation_id: getManufacturingOverview
  message_schema: StreamMessage
paths:
  /v1/overview:
    get:
      operationId: getManufacturingOverview
      summary: Manufacturing Overview attention-first view (Query)
      description: >-
        Read only. Returns composed backend facts with revision, as_of,
        generated_at and freshness. Freshness is the least-fresh source.
      x-bff-class: QUERY
      security:
        - browserSession: []
      parameters:
        - name: world_id
          in: query
          required: true
          description: Explicit world binding; there is no implicit current world.
          schema:
            type: string
            pattern: "\\S"
        - name: simulation_run_id
          in: query
          required: false
          schema:
            type: string
            pattern: "\\S"
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            pattern: "\\S"
        - name: as_of
          in: query
          required: false
          description: Historical-as-of instant; omitted means live. Historical views are read only.
          schema:
            $ref: "common.schema.json#/$defs/Timestamp"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: "\\S"
      responses:
        "200":
          description: Composed overview view model.
          content:
            application/json:
              schema:
                $ref: "overview-query.schema.json"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"
  /v1/commands:
    post:
      operationId: submitCommand
      summary: Submit command intent (Command)
      description: >-
        Expresses intent and may be rejected. The BFF attaches the session
        actor, routes the command unchanged and returns the backend acceptance
        verbatim. Acceptance is never completion; canonical effects arrive
        later through the stream.
      x-bff-class: COMMAND
      security:
        - browserSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "command.schema.json#/$defs/CommandRequest"
      responses:
        "202":
          description: Backend acceptance result (ACCEPTED, REJECTED, CONFLICT or STALE).
          content:
            application/json:
              schema:
                $ref: "command.schema.json#/$defs/CommandReceipt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"
  /v1/session:
    get:
      operationId: getSession
      summary: Current session and session-derived actor (Session)
      description: >-
        Returns the authenticated session. An anonymous or expired session
        gets 401 UNAUTHORIZED and no data.
      x-bff-class: SESSION
      security:
        - browserSession: []
      responses:
        "200":
          description: The authenticated session.
          content:
            application/json:
              schema:
                $ref: "session.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Error"
  /v1/session/login:
    get:
      operationId: startLogin
      summary: Begin the OIDC authorization-code flow (Session)
      description: >-
        Anonymous by design. Redirects the browser to the identity provider
        with server-generated state and PKCE. No application password store
        and no custom authentication protocol.
      x-bff-class: SESSION
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              required: true
              schema:
                type: string
        "503":
          $ref: "#/components/responses/Error"
  /v1/session/callback:
    get:
      operationId: completeLogin
      summary: Complete the OIDC flow and establish the session (Session)
      description: >-
        Anonymous by design. The BFF validates state, exchanges the code
        server side, rotates the session and sets the session cookie. Tokens
        are never returned to the browser.
      x-bff-class: SESSION
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            pattern: "\\S"
        - name: state
          in: query
          required: true
          schema:
            type: string
            pattern: "\\S"
      responses:
        "302":
          description: Redirect into the application with the session cookie set.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Error"
  /v1/session/logout:
    post:
      operationId: logout
      summary: End the session server side (Session)
      description: >-
        Invalidates the server-side session; clearing the browser state alone
        is not logout.
      x-bff-class: SESSION
      security:
        - browserSession: []
          csrfToken: []
      responses:
        "204":
          description: Session invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: cap_session
      description: >-
        Opaque BFF session cookie. No bearer token, access token or refresh
        token is ever exposed to the browser.
      x-cookie-attributes:
        http_only: true
        secure: true
        same_site_one_of: [Strict, Lax]
        bounded_expiry: true
        rotated_on_login: true
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required with the session cookie on every state-changing request.
        Obtained from getSession.
  responses:
    Unauthorized:
      description: Anonymous or expired session (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: "common.schema.json#/$defs/UnauthorizedError"
    Forbidden:
      description: Authenticated but refused, including a bad CSRF token (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: "common.schema.json#/$defs/ForbiddenError"
    Error:
      description: Common ErrorEnvelope.
      content:
        application/json:
          schema:
            $ref: "common.schema.json#/$defs/ErrorEnvelope"
  schemas:
    StreamMessage:
      $ref: "stream-message.schema.json"
