map $http_x_forwarded_proto $cap_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $time_iso8601 $cap_checked_at {
  ~^(?<cap_iso_prefix>[^+]+)\+00:00$ "${cap_iso_prefix}Z";
  default $time_iso8601;
}

# cap.log/v1 access record; request query strings and headers are deliberately omitted.
log_format cap_log_json escape=json
  '{"timestamp":"$cap_checked_at","severity":"INFO",'
  '"service":"command-center-web","service_version":"0.1.0",'
  '"environment":"demo","environment_class":"DEMO",'
  '"event_name":"web.http_request","message":"HTTP request completed",'
  '"request_id":"$request_id","attributes":{"method":"$request_method",'
  '"path":"$uri","status":$status,"duration_seconds":"$request_time"}}';

error_log /dev/stderr warn;

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout cap_log_json;

  location = /healthz {
    if (!-f /usr/share/nginx/html/index.html) { return 503; }
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"schema":"cap.health/v1","service":"command-center-web","environment":"demo","checked_at":"$cap_checked_at","live":true,"status":"READY","checks":[{"name":"static-shell","kind":"readiness","class":"REQUIRED","status":"READY"}]}';
  }

  location /v1/ {
    proxy_pass http://demo-bff:8082/v1/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cap_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
