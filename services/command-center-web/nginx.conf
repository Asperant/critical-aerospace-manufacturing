map $http_x_forwarded_proto $cap_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_name _;

  location /v1/ {
    proxy_pass http://demo-bff:8082/v1/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cap_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
