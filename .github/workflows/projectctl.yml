name: projectctl

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectctl-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  projectctl:
    name: projectctl
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned uv and CI toolchain
        run: |
          pipx install "uv==0.12.13"
          uv sync --project ci --locked
      - name: Install focused-gate dependencies
        run: python -m pip install -e './tools/projectctl[dev]'
      - name: Canonical validation
        run: timeout --signal=TERM 90s projectctl validate
      - name: Changed-scope focused tests and regressions
        env:
          FAST_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: timeout --signal=TERM 180s python ci/scripts/fast_scope_tests.py
      - name: Requirement catalog lint
        env:
          CATALOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: timeout --signal=TERM 90s projectctl catalog-lint --base "$CATALOG_BASE"
      - name: Whitespace and repository hygiene
        run: timeout --signal=TERM 90s git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Fast-gate diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          echo "FAST_GATE_DIAGNOSTIC status=${{ job.status }} ref=${GITHUB_SHA}"
          date -u
          ps -eo pid,etime,stat,cmd --sort=-etime | head -40
          git status --short --branch
