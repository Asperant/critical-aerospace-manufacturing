name: projectctl
on:
  pull_request:
  push:
    branches: [main, setup/project-management-bootstrap, 'control/**', 'wp/**']
permissions:
  contents: read
jobs:
  projectctl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve pre-push catalog history
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: python -m pip install -e './tools/projectctl[dev]'
      - name: Syntax sanity
        run: python -m compileall -q tools/projectctl/src tools/projectctl/tests
      - name: Projectctl tests
        run: python -m pytest tools/projectctl/tests -q
      - name: Host Plane queue security tests (offline)
        run: python -m unittest discover -s tools/host/plane-queue -p 'test_*.py' -v
      - name: Plane transition policy tests (offline fixtures only)
        run: python -m unittest discover -s tools/host/plane-transition -p 'test_*.py' -v
      - name: Canonical validation
        run: projectctl validate
      - name: Requirement catalog lint (WP-GOV-001)
        shell: bash
        env:
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CATALOG_BASE" || "$CATALOG_BASE" =~ ^0+$ ]]; then
            # A new branch has no before SHA; use its merge base with main.
            CATALOG_BASE="$(git merge-base HEAD origin/main)"
          fi
          projectctl catalog-lint --base "$CATALOG_BASE"
      - name: Whitespace and repository hygiene
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ "$base" =~ ^0+$ || -z "$base" ]]; then
            git show --format= --check HEAD
          else
            git diff --check "$base" HEAD
          fi
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [p for p in paths if p and (
              p.startswith('project_control/local/') or
              any(part in {'.venv', '__pycache__', '.pytest_cache'} or part.endswith('.egg-info') for part in p.split('/')) or
              p.rsplit('/', 1)[-1] == '.env')]
          if forbidden:
              raise SystemExit('Generated/local secret paths tracked: ' + ', '.join(forbidden))
          PY
