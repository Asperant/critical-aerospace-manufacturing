name: projectctl
on:
  pull_request:
  push:
    branches: [main, setup/project-management-bootstrap, 'control/**', 'wp/**']
permissions:
  contents: read
jobs:
  projectctl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: python -m pip install -e './tools/projectctl[dev]'
      - name: Syntax sanity
        run: python -m compileall -q tools/projectctl/src tools/projectctl/tests
      - name: Projectctl tests
        run: python -m pytest tools/projectctl/tests -q
      - name: Canonical validation
        run: projectctl validate
      - name: Whitespace and repository hygiene
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ "$base" =~ ^0+$ || -z "$base" ]]; then
            git show --format= --check HEAD
          else
            git diff --check "$base" HEAD
          fi
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [p for p in paths if p and (
              p.startswith('project_control/local/') or
              any(part in {'.venv', '__pycache__', '.pytest_cache'} or part.endswith('.egg-info') for part in p.split('/')) or
              p.rsplit('/', 1)[-1] == '.env')]
          if forbidden:
              raise SystemExit('Generated/local secret paths tracked: ' + ', '.join(forbidden))
          PY
