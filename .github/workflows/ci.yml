# WP-CICD-001 — tiered T1 pipeline (01 Item 41; FR-PLAT-004, NFR-DX-006).
#
# Tiers: t1-static (Ruff lint/format + Pyright ratchet, frontend lint, format,
# type-check and build), t1-unit (flake policy, CI tooling tests, projectctl and
# host tests with quarantine, frontend component tests), t1-contract
# (JSON Schema contracts, Operations BFF v1 contract tests) and t1-integration
# (REAL PostgreSQL + NATS JetStream, the REAL OTel Collector + OpenObserve
# telemetry pipeline of WP-OBS-001, and browser acceptance of WP-UI-001).
# `ci-gate` is the single required check: it fails unless every T1 job ran and
# succeeded, so a skipped or missing job can never count as a pass (§181–184).
#
# The required `projectctl` PR context is the bounded fast lane. Full projectctl
# regression runs in projectctl-full-regression on main/nightly/manual lanes.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'wp/**', 'control/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.13"
  UV_PYTHON: "3.11.16"
  UV_PYTHON_PREFERENCE: only-managed
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  static:
    name: t1-static
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync locked CI toolchain
        run: uv sync --project ci --locked
      - name: Static ratchet (Ruff lint + format, Pyright)
        run: uv run --project ci --locked python ci/scripts/static_ratchet.py check
      - name: Consumer framework static checks (WP-EVT-003)
        run: |
          uv run --project ci --locked ruff check packages/event-consumer
          uv run --project ci --locked ruff format --check packages/event-consumer
          uv run --project ci --locked pyright --project packages/event-consumer/pyrightconfig.json
      - name: Set up Node (version pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: services/command-center-web/.node-version
          cache: npm
          cache-dependency-path: services/command-center-web/package-lock.json
      - name: Frontend install (exact committed lockfile, no scripts)
        working-directory: services/command-center-web
        run: npm ci
      - name: Frontend lint, format and type-check (WP-UI-001)
        working-directory: services/command-center-web
        run: |
          npm run contract:check
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Frontend production build (WP-UI-001)
        working-directory: services/command-center-web
        run: npm run build

  unit:
    name: t1-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ci:ci/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync locked CI toolchain
        run: uv sync --project ci --locked
      - name: Flake governance (registry, expiry, no retry-until-green)
        run: uv run --project ci --locked python ci/scripts/check_flake_policy.py
      - name: CI tooling tests
        run: uv run --project ci --locked python -m pytest ci/tests -p pytest_quarantine
      - name: Test strategy conformance (WP-TEST-001)
        run: uv run --project ci --locked python ci/scripts/check_test_strategy.py
      - name: Projectctl changed-scope regressions (PR)
        if: github.event_name == 'pull_request'
        env:
          FAST_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Scope selector maps changed sources to tools/projectctl/tests and related suites.
          timeout --signal=TERM 180s python ci/scripts/fast_scope_tests.py
      - name: Consumer framework pure checks (WP-EVT-003)
        run: uv run --project ci --locked python -m pytest -c packages/event-consumer/pyproject.toml packages/event-consumer/tests -m 'not integration' -q -p pytest_quarantine
      - name: Core pure domain tests and typing (WP-CORE-001)
        run: |
          uv run --project ci --locked python -m pytest -c services/manufacturing-core/pyproject.toml services/manufacturing-core/tests -m 'not integration' -q -p pytest_quarantine
          uv run --project ci --locked pyright --project services/manufacturing-core/pyrightconfig.json
      - name: Simulator kernel unit/property tests and typing (WP-SIM-001)
        run: |
          uv run --project ci --locked python -m pytest -c services/manufacturing-simulator/pyproject.toml services/manufacturing-simulator/tests -q -p pytest_quarantine
          uv run --project ci --locked pyright --project services/manufacturing-simulator/pyrightconfig.json
      - name: mfgctl tests (quarantine-aware)
        run: uv run --project ci --locked python -m pytest tools/mfgctl/tests -q -p pytest_quarantine
      - name: Observability standard tests and typing (WP-OBS-001)
        run: |
          uv run --project ci --locked python -m pytest packages/observability/tests infra/observability/tests -m 'not integration' -q -p pytest_quarantine
          uv run --project ci --locked pyright --project packages/observability/pyrightconfig.json
          uv run --project ci --locked python -m cap_observability check-coverage infra/observability/coverage.json
      - name: Artifact reference contract tests and typing (WP-OBJ-001)
        run: |
          uv run --project ci --locked python -m pytest -c packages/artifacts/pyproject.toml packages/artifacts/tests -m 'not integration' -q -p pytest_quarantine
          uv run --project ci --locked pyright --project packages/artifacts/pyrightconfig.json
      - name: Trace registry lint and tests (WP-GOV-002)
        env:
          PYTHONPATH: ci:ci/scripts:tools/trace/src
        run: |
          uv run --project ci --locked python -m pytest -c tools/trace/pyproject.toml tools/trace/tests -q -p pytest_quarantine
          uv run --project ci --locked pyright --project tools/trace/pyrightconfig.json
          uv run --project ci --locked python -m cap_trace validate --base origin/main
          uv run --project ci --locked python -m cap_trace drift --strict
      - name: PR Requirement-Impact (TL-13, WP-GOV-002)
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ci:ci/scripts:tools/trace/src
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --project ci --locked python -m cap_trace impact --body-file "$RUNNER_TEMP/pr-body.md" --base origin/main
      - name: Platform composition definition tests (WP-PLAT-001)
        run: uv run --project ci --locked python -m pytest infra/compose/tests -m 'not integration' -q -p pytest_quarantine
      - name: Host Plane queue tests (offline)
        run: uv run --project ci --locked python -m unittest discover -s tools/host/plane-queue -p 'test_*.py'
      - name: Host Plane transition tests (offline)
        run: uv run --project ci --locked python -m unittest discover -s tools/host/plane-transition -p 'test_*.py'
      - name: Set up Node (version pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: services/command-center-web/.node-version
          cache: npm
          cache-dependency-path: services/command-center-web/package-lock.json
      - name: Frontend install (exact committed lockfile, no scripts)
        working-directory: services/command-center-web
        run: npm ci
      - name: Frontend component tests (WP-UI-001)
        working-directory: services/command-center-web
        run: npm test

  contract:
    name: t1-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync locked CI toolchain
        run: uv sync --project ci --locked
      - name: Contract registry compatibility (WP-EVT-001)
        env:
          PYTHONPATH: packages/contracts/src
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --project ci --locked python -m cap_contracts.ci_gate
      - name: JSON Schema contracts
        run: uv run --project ci --locked python ci/scripts/check_contracts.py
      - name: Operations BFF v1 contract tests and typing (WP-UI-001)
        run: |
          uv run --project ci --locked python -m pytest -c services/operations-bff/pyproject.toml services/operations-bff/tests -q
          uv run --project ci --locked pyright --project services/operations-bff/pyrightconfig.json

  integration:
    name: t1-integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ci:ci/scripts
      CI_POSTGRES_IMAGE: postgres:18-alpine
      CORE_TEST_DISPOSABLE: "1"
      CORE_STATUS_ARTIFACT: ${{ github.workspace }}/.ci-artifacts/core-migration-status.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync locked CI toolchain
        run: uv sync --project ci --locked
      - name: Start REAL PostgreSQL + NATS JetStream
        run: |
          mkdir -p .ci-artifacts
          ci/scripts/integration_services.sh up
          ci/scripts/integration_services.sh env >> "$GITHUB_ENV"
      - name: Integration smoke (boundary mode REAL)
        run: uv run --project ci --locked python -m pytest ci/integration -m integration -p pytest_quarantine
      - name: Core initial migration and persistence (real PostgreSQL 18)
        run: uv run --project ci --locked python -m pytest -c services/manufacturing-core/pyproject.toml services/manufacturing-core/tests/persistence -m integration -q -p pytest_quarantine
      - name: Upload Core migration status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-migration-status
          path: ${{ github.workspace }}/.ci-artifacts/core-migration-status.json
          if-no-files-found: error
      - name: Consumer idempotency acceptance (REAL PostgreSQL and JetStream, WP-EVT-003)
        env:
          EVT_TEST_DISPOSABLE: "1"
        run: uv run --project ci --locked python -m pytest -c packages/event-consumer/pyproject.toml packages/event-consumer/tests -m integration -q -p pytest_quarantine
      - name: Start REAL OTel Collector + OpenObserve (WP-OBS-001)
        run: |
          infra/observability/stack.sh up
          infra/observability/stack.sh env >> "$GITHUB_ENV"
          infra/observability/stack.sh dashboards
      - name: Telemetry pipeline smoke (boundary mode REAL)
        run: uv run --project ci --locked python -m pytest infra/observability/tests -m integration -q -p pytest_quarantine
      - name: Start REAL platform infra profile (WP-PLAT-001)
        run: |
          infra/compose/stack.sh up infra
          infra/compose/stack.sh env >> "$GITHUB_ENV"
      - name: Platform runtime tests (boundary mode REAL)
        run: uv run --project ci --locked python -m pytest infra/compose/tests -m integration -q -p pytest_quarantine
      - name: Artifact store tests (REAL SeaweedFS, WP-OBJ-001)
        env:
          CAP_ARTIFACT_TEST_DISPOSABLE: "1"
        run: uv run --project ci --locked python -m pytest -c packages/artifacts/pyproject.toml packages/artifacts/tests -m integration -q -p pytest_quarantine
      - name: Set up Node (version pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: services/command-center-web/.node-version
          cache: npm
          cache-dependency-path: services/command-center-web/package-lock.json
      - name: Frontend install (exact committed lockfile, no scripts)
        working-directory: services/command-center-web
        run: npm ci
      - name: Install Playwright browsers (Chromium and Firefox)
        working-directory: services/command-center-web
        run: npx playwright install --with-deps chromium firefox
      - name: Browser acceptance against a real BFF process (TEST-UI-BROWSER, WP-UI-001)
        working-directory: services/command-center-web
        run: npm run e2e
      - name: Service logs on failure
        if: failure()
        run: |
          docker logs cap-ci-postgres || true
          docker logs cap-ci-nats || true
          infra/observability/stack.sh logs || true
          infra/compose/stack.sh logs || true
      - name: Stop services
        if: always()
        run: |
          ci/scripts/integration_services.sh down
          infra/observability/stack.sh down || true
          infra/compose/stack.sh down || true

  gate:
    name: ci-gate
    needs: [static, unit, contract, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every T1 job to have run and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          event_name = os.environ["EVENT_NAME"]
          expected = {"static", "unit", "contract"}
          if event_name != "pull_request":
              expected.add("integration")
          missing = sorted(expected - needs.keys())
          failed = {
              k: needs[k]["result"]
              for k in sorted(expected)
              if needs[k]["result"] != "success"
          }
          for name in missing:
              print(f"MISSING     {name}")
          for name, result in failed.items():
              print(f"NOT SUCCESS {name}: {result}")
          if missing or failed:
              sys.exit(1)
          print("PASS: all applicable T1 jobs succeeded:", ", ".join(sorted(expected)))
          PY
