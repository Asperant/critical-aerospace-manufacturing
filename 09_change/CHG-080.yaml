      - Route/material/process-source verification before any mandatory heat-treatment or aerospace-process claim.
      - R1-R4 protocol preflight, paired-seed checks, leakage checks and independent validation before final benchmark execution.
  security_authority_impact: NONE — no identity, credential, authorization, HITL, Oracle-isolation, audit, database, NATS or deployment change.
  research_integrity:
    limits:
      - No real-factory performance claim may be inferred from the simulator.
      - Fault injection generates controlled faults; it does not prove real defect-detection performance.
      - Different public datasets are not treated as matched records of the same product/component.
      - Used-blade surface wear is not relabeled as CNC manufacturing defect data.
      - Hidden simulator fault/Oracle labels remain excluded from Vision, ML, AI and Scheduler inputs.
      - Synthetic-only or demo-only results cannot be presented as public held-out evidence.
    source_validation_required:
      - Gao et al. compressor-blade machining deviations
      - Hannover compressor-blade surface-roughness data
      - AeBAD
      - NASA Milling Wear
      - MATWI
      - Workpieces Image Dataset
      - MVTec AD as a methodological/auxiliary benchmark only
  risks:
    - CRB-F/CRB-M material, heat-treatment and exact production-route claims may exceed what the public sources support.
    - Four CNC resources may not be interchangeable; capability, tooling, fixture, setup and qualification data must be explicit.
    - The eight-lot/thirty-two-component population may require a bounded scenario adapter if a current runtime model is lot-level only; no hidden runtime contract change is authorized here.
    - A late change to products, routes, machine eligibility, datasets, splits, seeds or primary metrics would invalidate the freeze and require another C3 assessment.
    - WBS/milestone/dependency counts and source projections must be regenerated together; code presence must not be treated as WP acceptance.
    - Cross-domain data misuse, Oracle leakage, optimistic benchmark selection and overclaiming remain validity threats.
