        nominal_line: shared
        qualification: conditional_until_source_validation
      - id: CMM-01
        type: coordinate_measurement_machine
        nominal_line: shared
      - id: VIS-01
        type: visual_inspection_or_ndt_resource
        nominal_line: shared
    lots: 8
    representative_components: 32
    route_semantics: Re-entrant route semantics and canonical product/route/ToolGroup/equipment-eligibility models are reused; no new Line entity is made authoritative by this change.
  research_protocol:
    R1:
      question_binding: RQ-2
      comparison: normal production; failure without reassignment; baseline eligible-machine recovery; event-triggered rolling-horizon recovery
      primary_metrics: [total_production_loss, tardiness, throughput, WIP, cycle_time, recovery_time, schedule_churn]
      controls: paired scenarios, fixed scenario version, seed set, machine-eligibility snapshot, unchanged demand and due dates
    R2:
      question_binding: RQ-4 perception-to-operations
      comparison: final-only inspection versus intermediate CMM/visual controls plus final inspection
      primary_metrics: [detection_lag, avoided_downstream_processing, rework_or_scrap, quality_escape, inspection_cost, normalized_total_cost]
      controls: same lot/component genealogy, same route and fault family, independent inspection labels, no Oracle leakage
    R3:
      question_binding: detection and predictive evaluation supporting RQ-4 and model evidence
      lanes: [compressor_blade_geometric_deviation, blade_surface_or_image_observation, tool_wear_and_machine_health_support]
      validity_rule: Dataset-specific claims only; no cross-dataset product identity or paired production-history claim
    R4:
      question_binding: RQ-1 and RQ-3
      sequence: Sense -> RCA -> Predict -> Recovery -> Validator -> HITL -> Automation -> Core -> Outbox -> NATS -> Twin -> effect verification
      validity_rule: Recommendation is not execution, Vision does not mutate Core state, and one demo run is not research evidence.
  invariants_preserved:
    - Core remains the sole canonical manufacturing-state authority.
    - Simulator owns simulated physical execution and hidden Oracle state; Oracle labels never become model inputs.
    - Digital Twin remains a rebuildable projection and cannot become legal manufacturing truth.
    - Vision produces observations/results and cannot directly apply quality or hold decisions.
    - AI/RCA and Scheduler may propose or simulate; protected actions still require validation, policy and human approval.
    - Authentication, business authorization, HITL binding, audit, event identity, provenance and effect verification are unchanged.
    - No code, runtime, database, broker, identity, deployment or Demo Lab behavior is changed by preparing this record.
