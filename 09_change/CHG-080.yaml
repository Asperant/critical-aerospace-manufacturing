CHG-080:
  title: Freeze CRB-F/CRB-M ReferencePlant and R1-R4 research protocol
  trigger: Explicit project-owner request after reconciliation of the CAP final-scope package with the canonical project specification, WBS, dependency graph and research plan.
  reason: The approved architecture and research objectives are stable, but the final reference factory, product/route scenario parameters, dataset roles and R1-R4 experiment protocol are not yet recorded as one controlled baseline. Leaving these choices implicit would allow implementation and evidence to diverge from the intended final scope.
  class: C3
  review_risk_class: CR-4
  raised_in: S4
  raised_on: 2026-11-04
  owner: Asrın
  application_control_item: CTRL-DOC-010
  required_human_approvals: 0
  reviewers: []
  decision: DRAFT
  status: UNDER_REVIEW
  human_decision_basis: Explicit request to prepare this C3 record. The requester has accepted that C3 control is required, but has not yet approved CHG-080 for application to the canonical baseline. CHG-018 makes development-review approvals advisory and zero-count; it does not fabricate project-owner scope acceptance.
  scope:
    - Freeze two reference products: CRB-F (front-stage compressor rotor blade) and CRB-M (mid-stage compressor rotor blade), subject to source-backed material, route and process claims.
    - Freeze two nominal production lines as scenario groupings, not as a new canonical Line authority or domain aggregate.
    - Freeze seven reference resources: CNC-A1, CNC-A2, CNC-B1, CNC-B2, HT-01, CMM-01 and VIS-01.
    - Freeze the reference experiment population at eight lots (four CRB-F and four CRB-M) and thirty-two representative components (four components per lot). These are controlled scenario parameters, not a claim about an industrial plant size.
    - Permit cross-line CNC sharing only when capability, route operation, fixture/tooling, setup, qualification, quality and policy eligibility all hold. No unconditional machine substitution is introduced.
    - Model HT-01 as a resource. Treat heat treatment as conditional until material/process literature and the selected route support a mandatory operation; do not promote an unverified process assumption to a real aerospace requirement.
    - Bind R1 dynamic recovery to normal production, failure without reassignment, baseline eligible-machine dispatch and event-triggered rolling-horizon recovery with validation, HITL and Core verification.
    - Bind R2 early quality to final-only versus intermediate CMM/visual plus final-control comparisons, including detection lag, avoided downstream work, rework/scrap, escape and normalized cost.
    - Bind R3 detection evaluation to separated data lanes for compressor-blade geometric deviations, blade imagery/surface measurements and supporting tool-wear or machine-health observations. Cross-dataset records are not treated as paired records of one product.
    - Bind R4 human-controlled closed loop to observation or fault signal, evidence-grounded RCA, recovery proposal, independent validation, human approval, governed Automation/Core application, Outbox/NATS/Twin projection and effect verification.
    - Preserve all dataset boundaries: simulator Oracle/fault labels remain hidden from runtime models; fault injection is not real defect detection; synthetic and public data are not proprietary factory evidence.
