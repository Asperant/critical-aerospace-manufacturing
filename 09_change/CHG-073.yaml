  - Record DEP-022 READY at COMPONENT_READY using the exact real PostgreSQL 18 integration evidence and current-main product revision.
  - Record the LotHeld.v2 producer/consumer compatibility evidence without changing LotHeld.v1 semantics.
  - Keep DEP-023, DEP-024, DEP-025, DN-EVT-SPINE and NATS relay delivery as separate unresolved gates.
invariants_preserved:
