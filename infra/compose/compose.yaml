# WP-PLAT-001 — canonical Docker Compose definition of the platform runtime.
#
# Profiles follow 02 "Local Development Environment": infra, core, vision, ai,
# planning, platform, full, e2e. This file starts with the `infra` layer that
# every other profile builds on (02: PostgreSQL, event backbone, S3-compatible
# object storage, cache, identity provider); application services join their
# profiles as their container builds land (later WP-PLAT-001 slices).
#
# Credentials are never in this file: stack.sh generates them once per machine
# into env files under ${CAP_PLATFORM_STATE_DIR:-~/.local/state/cap-platform}
# (mode 0600), which Compose reads directly, so `mfgctl up <profile>` and
# `docker compose` work without exporting anything. Every port is bound to
# localhost; every image is pinned to an exact release; every service has a
# health check and a memory limit (02 "Resource profiles on the ~16 GB single
# host": limits are mandatory).
name: cap-platform

x-infra-profiles: &infra-profiles
  - infra
  - core
  - vision
  - ai
  - planning
  - platform
  - full
  - e2e

services:
  postgres:
    image: postgres:18.6-alpine
    profiles: *infra-profiles
    environment:
      POSTGRES_USER: cap
      POSTGRES_DB: cap
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/postgres.env
        required: false  # missing credentials stop PostgreSQL with a clear error
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${CAP_PG_PORT:-56432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  nats:
    image: nats:2.10.22-alpine
    profiles: *infra-profiles
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:${CAP_NATS_PORT:-56222}:4222"
      - "127.0.0.1:${CAP_NATS_MON_PORT:-56822}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.0.1-alpine
    profiles: *infra-profiles
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${CAP_VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    profiles: *infra-profiles
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=128", "-volume.max=8"]
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${CAP_S3_PORT:-56333}:8333"
      - "127.0.0.1:${CAP_SEAWEED_MASTER_PORT:-56933}:9333"
    healthcheck:
      # Healthy only when the master answers AND the S3 gateway returns an HTTP
      # status (any status: 403 without identities is fine); a refused or reset
      # connection means the gateway is not up yet.
      test:
        - "CMD-SHELL"
        - >-
          wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null &&
          wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 36
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    profiles: *infra-profiles
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: cap-admin
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/keycloak.env
        required: false
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${CAP_KEYCLOAK_PORT:-56080}:8080"
    healthcheck:
      # The image ships no curl/wget; bash /dev/tcp queries the management port.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  seaweedfs-data:
  keycloak-data:
