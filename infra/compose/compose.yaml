# WP-PLAT-001 — canonical Docker Compose definition of the platform runtime.
#
# Profiles follow 02 "Local Development Environment": infra, core, vision, ai,
# planning, platform, full, e2e. This file starts with the `infra` layer that
# every other profile builds on (02: PostgreSQL, event backbone, S3-compatible
# object storage, cache, identity provider); application services join their
# profiles as their container builds land (later WP-PLAT-001 slices).
#
# Credentials are never in this file: stack.sh generates them once per machine
# into env files under ${CAP_PLATFORM_STATE_DIR:-~/.local/state/cap-platform}
# (mode 0600), which Compose reads directly, so `mfgctl up <profile>` and
# `docker compose` work without exporting anything. Every port is bound to
# localhost; every image is pinned to an exact release; every service has a
# health check and a memory limit (02 "Resource profiles on the ~16 GB single
# host": limits are mandatory).
name: cap-platform

x-infra-profiles: &infra-profiles
  - infra
  - core
  - vision
  - ai
  - planning
  - platform
  - full
  - e2e

# WP-PLAT-003: 02 "Resource profiles": Temporal belongs to PLANNING (Scheduler,
# Automation worker) and to every profile that runs the full topology.
x-temporal-profiles: &temporal-profiles
  - planning
  - platform
  - full
  - e2e

# 02 "Resource profiles": Qdrant belongs to AI (RAG retrieval projection).
x-qdrant-profiles: &qdrant-profiles
  - ai
  - platform
  - full
  - e2e

# MLflow is experiment/model-tracking support for the Vision and AI/ML work (02).
x-mlflow-profiles: &mlflow-profiles
  - vision
  - ai
  - platform
  - full
  - e2e

x-mlflow-env: &mlflow-env
  MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
  CAP_MLFLOW_BUCKET: cap-mlflow-artifacts

x-temporal-sql: &temporal-sql
  SQL_PLUGIN: postgres12
  SQL_HOST: postgres
  SQL_PORT: "5432"
  SQL_USER: cap

services:
  postgres:
    image: postgres:18.6-alpine
    profiles: *infra-profiles
    environment:
      POSTGRES_USER: cap
      POSTGRES_DB: cap
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/postgres.env
        required: false  # missing credentials stop PostgreSQL with a clear error
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${CAP_PG_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  nats:
    image: nats:2.10.22-alpine
    profiles: *infra-profiles
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:${CAP_NATS_PORT:-24222}:4222"
      - "127.0.0.1:${CAP_NATS_MON_PORT:-28222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.0.1-alpine
    profiles: *infra-profiles
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${CAP_VALKEY_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    profiles: *infra-profiles
    # Every bucket is a SeaweedFS collection that grows 7 volumes on its first
    # write; -volume.max must leave room for all artifact buckets (WP-OBJ-001: three
    # recovery-class buckets; WP-PLAT-003: the MLflow bucket) plus headroom. Volumes are sparse files of at most 128 MB.
    # S3 identities (WP-OBJ-001) come from s3.json generated by stack.sh in the state
    # directory; with identities defined, anonymous S3 access is denied.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=128", "-volume.max=64"]
    volumes:
      - seaweedfs-data:/data
      - type: bind
        source: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/s3.json
        target: /etc/seaweedfs/s3.json
        read_only: true
        bind:
          create_host_path: false  # run stack.sh once: it generates the identities
    ports:
      - "127.0.0.1:${CAP_S3_PORT:-28333}:8333"
      - "127.0.0.1:${CAP_SEAWEED_MASTER_PORT:-29333}:9333"
    healthcheck:
      # Healthy only when the master answers AND the S3 gateway returns an HTTP
      # status (any status: 403 without identities is fine); a refused or reset
      # connection means the gateway is not up yet.
      test:
        - "CMD-SHELL"
        - >-
          wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null &&
          wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 36
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    profiles: *infra-profiles
    # --import-realm creates the platform realm from the definition below when it
    # does not exist yet; an existing realm is never overwritten (WP-PLAT-003).
    command: ["start-dev", "--http-port=8080", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: cap-admin
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/keycloak.env
        required: false
    volumes:
      - keycloak-data:/opt/keycloak/data
    configs:
      - source: keycloak-platform-realm
        target: /opt/keycloak/data/import/cap-platform-realm.json
    ports:
      - "127.0.0.1:${CAP_KEYCLOAK_PORT:-28080}:8080"
    healthcheck:
      # The image ships no curl/wget; bash /dev/tcp queries the management port.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      # First start-dev boot runs the Quarkus build: 205 s on the shared host
      # (WP-PLAT-003 measurement), so allow up to ~10 minutes before unhealthy.
      retries: 60
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # WP-PLAT-003 — Temporal, self-hosted on PostgreSQL (02: PostgreSQL persistence,
  # no Cassandra). A one-shot job creates and migrates the two databases, the
  # server starts only after it succeeded, and a second job creates the platform
  # namespace. Both jobs are idempotent, so every `up` re-applies them safely.
  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    profiles: *temporal-profiles
    environment: *temporal-sql
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/temporal.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        for db in temporal temporal_visibility; do
        temporal-sql-tool --db "$$db" create-database 2>/dev/null || echo "database $$db exists";
        done;
        temporal-sql-tool --db temporal setup-schema -v 0.0 2>/dev/null || true;
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned;
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0 2>/dev/null || true;
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned;
        echo "temporal schemas current"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    profiles: *temporal-profiles
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      DB_PORT: "5432"
      POSTGRES_USER: cap
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/temporal.env
        required: false
    configs:
      - source: temporal-dynamicconfig
        target: /etc/temporal/dynamicconfig.yaml
    ports:
      - "127.0.0.1:${CAP_TEMPORAL_PORT:-27233}:7233"
      - "127.0.0.1:${CAP_TEMPORAL_HTTP_PORT:-27243}:7243"
    healthcheck:
      # The frontend HTTP API answers only when the frontend service is serving.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7243/api/v1/system-info >/dev/null"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      postgres:
        condition: service_healthy
      temporal-schema:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  # Creates the platform namespace, then stays up as its readiness probe: healthy
  # only while the namespace is registered. A job that exits would make
  # `up --wait` (stack.sh and mfgctl) fail even with status 0, as nothing awaits it.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    profiles: *temporal-profiles
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      CAP_TEMPORAL_NAMESPACE: ${CAP_TEMPORAL_NAMESPACE:-cap}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        temporal operator namespace describe -n "$$CAP_TEMPORAL_NAMESPACE" >/dev/null 2>&1 ||
        temporal operator namespace create -n "$$CAP_TEMPORAL_NAMESPACE";
        echo "namespace $$CAP_TEMPORAL_NAMESPACE registered";
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe -n \"$$CAP_TEMPORAL_NAMESPACE\" >/dev/null"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      temporal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  # WP-PLAT-003 — Qdrant: rebuildable vector/retrieval projection for RAG (02), never
  # a canonical store. Requests need the per-host API key; health probes do not.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: *qdrant-profiles
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/qdrant.env
        required: false
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${CAP_QDRANT_PORT:-26333}:6333"
      - "127.0.0.1:${CAP_QDRANT_GRPC_PORT:-26334}:6334"
    healthcheck:
      # The image ships no curl/wget and its /bin/sh is dash: bash /dev/tcp asks
      # the readiness endpoint.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # WP-PLAT-003 — MLflow: tracking support, never the model-governance authority (02).
  # Metadata in PostgreSQL, artifacts in SeaweedFS through the server (--serve-artifacts).
  mlflow-init:
    build: ./mlflow
    image: cap-platform/mlflow:3.16.1-cap1
    profiles: *mlflow-profiles
    environment: *mlflow-env
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/mlflow-init.env
        required: false
    command: ["python", "/opt/cap/mlflow_init.py"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    restart: "no"

  mlflow:
    build: ./mlflow
    image: cap-platform/mlflow:3.16.1-cap1
    profiles: *mlflow-profiles
    environment:
      <<: *mlflow-env
      # Tracking support only (02): no server-side job execution. Left on, MLflow 3
      # forks a pool of ~150 MiB job consumers that starve the request workers.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    env_file:
      - path: ${CAP_PLATFORM_STATE_DIR:-${HOME}/.local/state/cap-platform}/mlflow.env
        required: false
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --serve-artifacts
      - --artifacts-destination=s3://cap-mlflow-artifacts
      - --allowed-hosts=localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*
    ports:
      - "127.0.0.1:${CAP_MLFLOW_PORT:-25000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  seaweedfs-data:
  keycloak-data:
  qdrant-data:

configs:
  # Temporal dynamic configuration: server defaults; overrides are added here and
  # reviewed like any other runtime setting, never changed inside a container.
  temporal-dynamicconfig:
    content: |
      {}

  # WP-PLAT-003 — minimal platform realm as code: proves that the identity provider
  # issues real tokens (DEP-010). Roles, users, BFF/UI OIDC clients and TLS belong to
  # WP-SEC-001. The client secret is resolved by Keycloak from its environment
  # (keycloak.env, generated per host by stack.sh); it is never in this file.
  keycloak-platform-realm:
    content: |
      {
        "realm": "cap-platform",
        "enabled": true,
        "sslRequired": "external",
        "registrationAllowed": false,
        "accessTokenLifespan": 300,
        "clients": [
          {
            "clientId": "cap-platform-smoke",
            "name": "Platform readiness smoke client (WP-PLAT-003)",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "clientAuthenticatorType": "client-secret",
            "secret": "$${CAP_KEYCLOAK_SMOKE_CLIENT_SECRET}",
            "serviceAccountsEnabled": true,
            "standardFlowEnabled": false,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "redirectUris": []
          }
        ]
      }
