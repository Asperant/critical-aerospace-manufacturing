[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-event-consumer"
version = "0.1.0"
description = "Consumer-owned transactional processed-message ledger (WP-EVT-003)"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cap_event_consumer = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = ["integration: requires disposable real PostgreSQL 18"]
