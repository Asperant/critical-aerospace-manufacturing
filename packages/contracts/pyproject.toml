[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-contracts"
version = "0.1.0"
description = "Integration Contract Registry foundation: layout, version rules and boundary validation (WP-EVT-001)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]
